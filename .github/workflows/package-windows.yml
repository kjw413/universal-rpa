name: package-windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: package-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Packaging and the packaged-GUI smoke both need a real desktop session: the
  # smoke creates a QApplication and the production MainWindow, which a hosted
  # runner cannot do meaningfully. This job therefore only runs self-hosted.
  package:
    name: build and smoke the Windows package
    runs-on: [self-hosted, windows, x64, rpa-interactive]
    steps:
      - uses: actions/checkout@v4

      - name: Create a pinned environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev,build]"

      - name: Confirm the toolchain pins
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -c "import PySide6; assert PySide6.__version__ == '6.11.1', PySide6.__version__"
          .\.venv\Scripts\python.exe -m pip show Nuitka | Select-String '^Version: 4\.1\.3$'
          if ($LASTEXITCODE -ne 0) { throw 'Nuitka is not pinned to 4.1.3' }

      - name: Build
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Smoke the packaged executable in isolation
        shell: pwsh
        run: .\scripts\smoke_packaged.ps1

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: universal-rpa-studio-windows-x64
          path: dist/
          retention-days: 14
          if-no-files-found: error
